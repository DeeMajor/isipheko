# The gate CLAUDE.md rule 9 and the working agreement have both claimed since
# M1-01, and which did not exist until OPS-01.
#
# Rule 9 says *"CI fails the build on breach"* of the 150KB budget. There was no
# CI. `pnpm gate:size` was a script somebody had to remember, and
# docs/decisions.md M3-02 §6 records two runs that reported numbers from a stale
# build because nothing forced one.
#
# ## Four jobs, and the split is about what each needs rather than tidiness
#
# `check` needs nothing and answers in under a minute, so it is what a
# contributor watches. `integration` needs a container runtime for
# Testcontainers. `e2e` and `budget` each need a database with migrations, and
# `budget` additionally needs a production build — which is the slowest thing
# here and the reason it is not folded into `e2e`.
#
# ## What is deliberately not here
#
# **`pnpm check:payfast` is not a CI step and must not become one.** It posts a
# real form to PayFast's sandbox. docs/decisions.md M5-01 §4: *"a gate that
# fails when the wifi does is a gate people learn to re-run rather than read."*
#
# **`pnpm format:check` is not a CI step yet**, and that is a gap rather than a
# decision. Twenty files from Milestone 4 are not Prettier-clean, so adding it
# today would fail every run until somebody pays for a reformat. See
# docs/decisions.md OPS-01 §3.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The database compose.yaml creates, with the two roles the append-only proof
  # depends on. `isipheko_app` holds no UPDATE or DELETE on ledger_entries and
  # `isipheko_owner` runs migrations; a single-role database would make
  # `tests/integration/ledger.test.ts` pass while proving nothing (M1-02).
  DATABASE_URL: postgresql://isipheko_app:isipheko_local_dev@localhost:5433/isipheko
  MIGRATION_DATABASE_URL: postgresql://isipheko_owner:isipheko_local_dev@localhost:5433/isipheko

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts its own Postgres and mounts prisma/init, so this
      # job needs no service container. The runner's Docker socket is enough.
      #
      # These are the tests that prove the bereavement CHECK, the append-only
      # ledger and the absence of a money path on a collection — the three
      # things a green `pnpm test` does not cover and the three that guard a
      # funeral page and the trust artefact (vitest.config.ts).
      - run: pnpm test:integration

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same compose file a developer runs, so the two roles and the C
      # locale are identical rather than approximated.
      - run: docker compose up -d --wait
      - run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      # `forbidOnly`, two retries and one worker are already conditioned on CI
      # in playwright.config.ts.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  budget:
    name: performance budget (rule 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      # A real production build, every run. The gate measures whatever is in
      # `.next` and does not check that it is current, which is how two earlier
      # runs reported numbers from a stale one — building here is what makes the
      # measurement mean anything.
      #
      # The secrets are generated per run and thrown away. The production schema
      # refuses the published development keys by value (M1-02 §5), so they have
      # to be real ones even though nothing here encrypts anything worth
      # reading.
      - name: Generate throwaway production secrets
        run: |
          {
            echo "BANK_ACCOUNT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "ID_NUMBER_PEPPER=$(openssl rand -base64 32)"
            echo "OTP_PEPPER=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3210
      # The gate starts the production server itself, seeds a published funeral,
      # measures what crosses the wire, measures LCP on throttled 3G and deletes
      # the fixture. It fails the build on breach and names the cause.
      - run: pnpm gate:size
