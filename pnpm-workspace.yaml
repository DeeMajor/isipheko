# pnpm blocks dependency install scripts unless they are listed here.
# Keep this list minimal and deliberate — every `true` is a package we let run
# arbitrary code at install time, which is a supply-chain decision, not a
# convenience one.
allowBuilds:
  # Native resolver used by the ESLint import plugin.
  unrs-resolver: true
  # Vitest's bundler.
  esbuild: true
  # Playwright's browser download, driven by `pnpm exec playwright install`.
  '@playwright/test': true
  # Prisma's query engine binary. Without it the CLI cannot run a migration and
  # the client cannot open a connection.
  '@prisma/engines': true
  prisma: true
  # Testcontainers' transitive dependencies. All three are optional native or
  # codegen steps, and Testcontainers works without them — cpu-features and ssh2
  # only matter for driving a container host over SSH, which we do not do.
  cpu-features: false
  protobufjs: false
  ssh2: false
